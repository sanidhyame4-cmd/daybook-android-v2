 else if(a=='swres'){const t=find(id);t.wk=0;t.run=null;save();render()}
 else if(a=='swset'){const t=find(id);t.wk=Math.max(0,+$('#mh').value||0)+Math.min(59,Math.max(0,+$('#mm').value||0))/60;if(t.run)t.run=Date.now();save();render()}
 else if(a=='save')doSave();
 else if(a=='del'){S.tasks=S.tasks.filter(x=>x.id!=ed.d.id);save();ed=null;render()}
 else if(a=='addsub'){sync();ed.d.subs.push({id:Date.now(),t:'',wRaw:'',c:0});renderEd()}
 else if(a=='rmsub'){sync();ed.d.subs=ed.d.subs.filter(s=>s.id!=el.dataset.sid);renderEd()}
 else if(a=='tab'){tab=v;ov=null;stDirty=true;render()}
 else if(a=='theme'){S.theme=v;save();applyTheme();render()}
 else if(a=='snd'){S.sound=S.sound===false;save();if(S.sound)chime();render()}
 else if(a=='smon'){const q=stM.split('-').map(Number);stM=key(new Date(q[0],q[1]-1+ +v,1)).slice(0,7);renderSt()}
 else if(a=='syr'){stY+= +v;renderSt()}
 else if(a=='sday'){ov={k:'dayres',d:v};renderOv()}
 else return false;
 return true}
document.addEventListener('change',e=>{if(e.target.id=='fd'&&ed){sync();renderEd()}if(e.target.id=='sm'){S.streakMin=Math.min(100,Math.max(1,+e.target.value||50));save();render()}});
document.addEventListener('input',e=>{if(e.target.id=='mgq'&&mg){mg.q=e.target.value;$('#mgl').innerHTML=mgList()}});
let tk=0;setInterval(()=>{document.querySelectorAll('[data-sw]').forEach(el=>{const t=find(el.dataset.sw);if(t)el.textContent=el.dataset.k=='g'?g2(workedH(t))+' / '+t.gh+' h':hms(workedH(t))});if(++tk%15==0&&S.tasks.some(t=>t.run)&&!ov&&!ed&&!tp&&!mg&&tab=='routine')render()},1000);
let stDirty=true,stM=S.open.slice(0,7),stY=+S.open.slice(0,4),AC=null,cid=0;
S.theme=S.theme||'frost';if(S.sound===undefined)S.sound=true;
const THEMES=[['frost','Frost','#ff5c7a'],['aurora','Aurora','#7c9cff'],['ocean','Ocean','#4de1d0'],['sunset','Sunset','#ff9f6b'],['midnight','Midnight','#8d8d99']];
function applyTheme(){document.documentElement.setAttribute('data-th',S.theme||'frost')}
function chime(sm){if(S.sound===false)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(sm?[784,988]:[659,880,1175]).forEach((hz,i)=>{const o=AC.createOscillator(),g=AC.createGain(),s=t+i*.11;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.18,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.5);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.55)})}catch(e){}}
function setC(id,c,sid){const t=find(id),b=eff(t),o=tgt(id,sid);o.c=Math.max(0,Math.min(100,Math.round(+c||0)));save();ov=null;if(b<99.95&&eff(t)>=99.95)chime();else if(sid&&o.c==100)chime(1);render()}
function completeAll(id,sid){const t=find(id);if(sid){const s=t.subs.find(x=>x.id==sid),was=s.c==100;s.c=was?0:100;if(!was)chime(1)}
 else if(eff(t)>=99.95){t.c=0;t.wk=0;t.run=null;t.subs.forEach(s=>{s.c=0})}
 else{t.c=100;if(t.gt=='time'){t.wk=Math.max(workedH(t),t.gh);t.run=null}t.subs.forEach(s=>{s.c=100});chime()}
 save();ov=null;render()}
const tier=o=>o>=99.95?5:o>=75?4:o>=50?3:o>=25?2:o>0?1:0;
function calHtml(){const q=stM.split('-').map(Number),y=q[0],m=q[1],first=new Date(y,m-1,1),dim=new Date(y,m,0).getDate();let c='<i></i>'.repeat(first.getDay());
 for(let d=1;d<=dim;d++){const k=y+'-'+pad(m)+'-'+pad(d),e=S.ended[k];c+=`<button class="cd ${e?'k'+tier(rec(k).out):''} ${k==S.open?'tod':''}" data-a="sday" data-v="${k}">${d}</button>`}
 return`<div class="stc"><div class="cnav"><button data-a="smon" data-v="-1">‹</button><h4>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h4><button data-a="smon" data-v="1">›</button></div><div class="cal">${'SMTWTFS'.split('').map(x=>`<b>${x}</b>`).join('')}${c}</div><div class="lg">Less ${[1,2,3,4,5].map(i=>`<i class="k${i}" style="width:12px;height:12px;border-radius:4px;margin:0 2px"></i>`).join('')} More · tap a day for its result</div></div>`}
function heatHtml(){let c='<i class="hz"></i>'.repeat(new Date(stY,0,1).getDay());const end=new Date(stY,11,31);for(let d=new Date(stY,0,1);d<=end;d.setDate(d.getDate()+1)){const k=key(d);c+=S.ended[k]?`<i class="hz k${tier(rec(k).out)}"></i>`:'<i class="hz"></i>'}
 return`<div class="stc"><div class="cnav"><button data-a="syr" data-v="-1">‹</button><h4>${stY}</h4><button data-a="syr" data-v="1">›</button></div><div class="heat">${c}</div></div>`}
function recHtml(){const K=Object.keys(S.ended).sort(),R=K.map(rec);let best=0,run=0,prev=null;
 K.forEach((k,i)=>{const cons=prev&&Math.round((new Date(k+'T00:00:00')-new Date(prev+'T00:00:00'))/864e5)==1;run=R[i].out>=S.streakMin?(cons&&run?run+1:1):0;best=Math.max(best,run);prev=k});
 const n=R.length,sum=f=>R.reduce((a,x)=>a+f(x),0),bd=R.reduce((a,x)=>!a||x.out>a.out?x:a,null),W=sum(x=>x.W),Rm=R.filter(x=>x.mood),row=(a,b)=>`<div class="rr"><span>${a}</span><b>${b}</b></div>`;
 return`<div class="stc"><h4>Records</h4>${row('Perfect days',R.filter(x=>x.out>=99.95).length+' day')}${row('Best streak',best+' day')}${row('Current streak',streak()+' day')}${row('Days ended',n)}${row('Best day',bd?bd.d.slice(5)+' · '+r(bd.out)+'%':'–')}${row('Average output',n?r(sum(x=>x.out)/n)+'%':'–')}${row('Total real work',r(sum(x=>x.O))+' h')}${row('Tasks fully done',sum(x=>x.full)+' of '+sum(x=>x.n))}${row('Assigned work done',(W?r(sum(x=>x.E)/W*100):0)+'%')}${row('Average rating',Rm.length?r(Rm.reduce((a,x)=>a+x.mood,0)/Rm.length)+' / 10':'–')}</div>`}
function chart(R,ser,o={}){const W=340,H=160,L=30,T=10,B=22,iw=W-L-8,ih=H-T-B,n=R.length,mx=o.max||100,sl=iw/n,cx=i=>L+(i+.5)*sl,y=v=>T+ih-Math.min(Math.max(v,0),mx)/mx*ih,id='g'+(++cid),base=T+ih;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible"><defs>${ser.map((q,i)=>`<linearGradient id="${id}${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${q.c}" stop-opacity="${q.t=='bar'?1:.32}"/><stop offset="1" stop-color="${q.c}" stop-opacity="${q.t=='bar'?.5:0}"/></linearGradient>`).join('')}</defs>`;
 [0,.5,1].forEach(g=>{s+=`<line x1="${L}" x2="${W-8}" y1="${y(mx*g)}" y2="${y(mx*g)}" stroke="#e3e6f3" stroke-dasharray="3 5"/><text x="${L-6}" y="${y(mx*g)+3}" font-size="9" fill="#9a9db0" text-anchor="end">${r(mx*g)}</text>`});
 const k=Math.ceil(n/6);R.forEach((x,i)=>{if(i%k==0)s+=`<text x="${cx(i)}" y="${H-6}" font-size="9" fill="#9a9db0" text-anchor="middle">${x.d.slice(8)}/${x.d.slice(5,7)}</text>`});
 ser.forEach((q,qi)=>{const pts=R.map((x,i)=>x[q.k]==null?null:[cx(i),y(x[q.k])]).filter(Boolean);
  if(q.t=='bar'){const bw=Math.max(4,Math.min(26,sl*.62));R.forEach((x,i)=>{if(x[q.k]==null)return;const hh=Math.max(base-y(x[q.k]),2);s+=`<rect x="${cx(i)-bw/2}" y="${base-hh}" width="${bw}" height="${hh}" rx="${Math.min(7,bw/2)}" fill="url(#${id}${qi})"/>`})}
  else if(pts.length){let d='M'+pts[0].join(',');for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],mxp=(a[0]+b[0])/2;d+=` C${mxp},${a[1]} ${mxp},${b[1]} ${b[0]},${b[1]}`}
   if(!q.dash&&pts.length>1)s+=`<path d="${d} L${pts[pts.length-1][0]},${base} L${pts[0][0]},${base}Z" fill="url(#${id}${qi})"/>`;
   if(pts.length>1)s+=`<path d="${d}" fill="none" stroke="${q.c}" stroke-width="2.8" stroke-linecap="round"${q.dash?' stroke-dasharray="4 5"':''}/>`;
   if(!q.dash&&n<=31)pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${q.c}" opacity=".14"/><circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#fff" stroke="${q.c}" stroke-width="2.2"/>`})}});
 return s+'</svg>'}
applyTheme();
render();
